<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Update in Progress</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .update-box {
            max-width: 750px;
            padding: 60px 40px;
            border: 1px solid #d4af6a;
        }

        .brand {
            color: #d4af6a;
            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 5px;
            margin-bottom: 35px;
        }

        h1 {
            color: #e4c47f;
            font-family: Georgia, serif;
            font-size: 48px;
            margin-bottom: 25px;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .small {
            color: #c8c8c8;
            font-size: 16px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            .update-box {
                padding: 45px 25px;
            }
        }
    </style>
</head>

<body>
    <main class="update-box">
        <div class="brand">LADY ROZIER</div>

        <h1>Website Update in Progress</h1>

        <p>
            We're making some exciting updates to better serve you.
        </p>

        <p>
            Please check back soon.
        </p>

        <div class="small">
            Thank you for your patience.
        </div>
    </main>
</body>
</html>
